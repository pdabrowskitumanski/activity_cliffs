[project]
name = "activity-cliffs"
version = "1.0.0"
description = "Analysis of activity cliffs in molecular datasets across embeddings and distance metrics"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "click>=8.3.1",
    "xgboost>=2.0.0",
    "matplotlib>=3.10.8",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pydantic>=2.12.5",
    "rdkit>=2025.9.3",
    "rich>=14.2.0",
    "ripser>=0.6.0",
    "scipy>=1.15.3",
    "torch>=2.9.1",
    "transformers>=4.57.3",
    "umap-learn>=0.5.4",
    "numba>=0.58.0",
    "chemprop>=2.2.0",
    "persim>=0.3.0",
    "diptest>=0.5.0",
]
